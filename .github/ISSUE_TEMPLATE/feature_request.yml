name: Feature request
description: Propose a focused improvement with a clear user problem.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem before the solution. Large features should start
        as a discussion so the scope, access-control impact, and maintenance cost can
        be reviewed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, other tools, or a simpler approach.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documents and review
        - Drafting and comparisons
        - Research
        - Workflows and approvals
        - Client portal
        - Matter archives
        - MCP and assistant integration
        - Notifications and connectors
        - Deployment and operations
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: I understand this project does not provide legal advice.
          required: true
        - label: I am willing to help test or contribute this change.
